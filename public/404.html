<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Matthew McWilliams</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts path to query string so index.html can restore it
      const path = window.location.pathname.slice(1);
      const query = window.location.search;
      window.location.replace(
        window.location.origin + '/me/?p=' + encodeURIComponent(path) + (query ? '&q=' + encodeURIComponent(query.slice(1)) : '')
      );
    </script>
  </head>
  <body></body>
</html>
