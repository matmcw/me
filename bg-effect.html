<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Canvas Particles Preview</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background: radial-gradient(
						1200px 800px at 20% 15%,
						rgba(98, 116, 231, 0.55),
						transparent 60%
					),
					radial-gradient(
						1000px 700px at 80% 25%,
						rgba(135, 82, 163, 0.55),
						transparent 60%
					),
					radial-gradient(
						900px 650px at 50% 85%,
						rgba(98, 116, 231, 0.35),
						transparent 60%
					),
					linear-gradient(
						135deg,
						#0b0f1a 0%,
						#070913 40%,
						#05060f 100%
					);
				overflow: hidden;
			}
			#glass {
				position: fixed;
				inset: 0;
				pointer-events: none;
				/* Frosted-glass layer */
				background: rgba(255, 255, 255, 0.06);
				backdrop-filter: blur(18px) saturate(140%);
				-webkit-backdrop-filter: blur(18px) saturate(140%);
				box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
			}
			canvas {
				position: fixed;
				inset: 0;
				display: block;
				width: 100vw;
				height: 100vh;
			}
		</style>
	</head>
	<body>
		<div id="glass"></div>
		<canvas id="c"></canvas>

		<script>
			// Self-contained canvas particle preview (no external CDN).
			// Dot colors constrained between #6274e7 and #8752a3.

			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");

			let W = window.innerWidth;
			let H = window.innerHeight;

			function resize() {
				const dpr = Math.max(1, window.devicePixelRatio || 1);
				W = window.innerWidth;
				H = window.innerHeight;
				canvas.width = Math.floor(W * dpr);
				canvas.height = Math.floor(H * dpr);
				canvas.style.width = W + "px";
				canvas.style.height = H + "px";
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			}
			window.addEventListener("resize", resize);
			resize();

			// Palette endpoints
			const A = { r: 0x62, g: 0x74, b: 0xe7 }; // #6274e7
			const B = { r: 0x87, g: 0x52, b: 0xa3 }; // #8752a3

			const lerp = (a, b, t) => a + (b - a) * t;
			const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

			function colorBetween(t) {
				// t in [0,1]
				const r = Math.round(lerp(A.r, B.r, t));
				const g = Math.round(lerp(A.g, B.g, t));
				const b = Math.round(lerp(A.b, B.b, t));
				return `rgb(${r},${g},${b})`;
			}

			const mouse = { x: 0, y: 0, down: false };
			window.addEventListener("mousemove", (e) => {
				mouse.x = e.clientX;
				mouse.y = e.clientY;
			});

			// Click = push 4 particles
			window.addEventListener("click", (e) => {
				for (let i = 0; i < 4; i++) {
					spawnParticle(e.clientX, e.clientY, true);
				}
			});

			// Config-ish
			const settings = {
				count: 80,
				minSize: 1,
				maxSize: 3,
				speed: 120, // slightly slower drift
				linkDistance: 150,
				linkOpacity: 0.4,
				dotOpacity: 0.5,
				repulseDistance: 260,
				repulseStrength: 850, // similar "factor"
			};

			const particles = [];

			function rand(min, max) {
				return min + Math.random() * (max - min);
			}

			function spawnParticle(
				x = rand(0, W),
				y = rand(0, H),
				burst = false
			) {
				const angle = rand(0, Math.PI * 2);
				const baseSpeed =
					settings.speed * (burst ? rand(0.6, 1.2) : rand(0.3, 1));
				particles.push({
					x,
					y,
					vx: Math.cos(angle) * baseSpeed,
					vy: Math.sin(angle) * baseSpeed,
					r: rand(settings.minSize, settings.maxSize),
					t: Math.random(), // color interpolation factor
				});
			}

			// init
			for (let i = 0; i < settings.count; i++) spawnParticle();

			let last = performance.now();

			function step(now) {
				const dt = Math.min(0.05, (now - last) / 1000); // cap dt to avoid jumps
				last = now;

				// clear
				ctx.clearRect(0, 0, W, H);

				// update
				for (const p of particles) {
					// Hover repulse
					const dx = p.x - mouse.x;
					const dy = p.y - mouse.y;
					const dist = Math.hypot(dx, dy) || 1;
					if (dist < settings.repulseDistance) {
						const force =
							(1 - dist / settings.repulseDistance) *
							settings.repulseStrength;
						p.vx += (dx / dist) * force * dt;
						p.vy += (dy / dist) * force * dt;
					}

					// move
					p.x += p.vx * dt;
					p.y += p.vy * dt;

					// soft damping
					p.vx *= 1 - 0.001;
					p.vy *= 1 - 0.001;

					// keep speeds from exploding
					const maxV = 2600;
					p.vx = clamp(p.vx, -maxV, maxV);
					p.vy = clamp(p.vy, -maxV, maxV);

					// wrap (out mode)
					if (p.x < -10) p.x = W + 10;
					if (p.x > W + 10) p.x = -10;
					if (p.y < -10) p.y = H + 10;
					if (p.y > H + 10) p.y = -10;

					// gentle color drift but stays within endpoints
					p.t +=
						Math.sin(now / 1000 + p.x * 0.001 + p.y * 0.001) *
						0.002;
					p.t = clamp(p.t, 0, 1);
				}

				// links
				for (let i = 0; i < particles.length; i++) {
					const a = particles[i];
					for (let j = i + 1; j < particles.length; j++) {
						const b = particles[j];
						const dx = a.x - b.x;
						const dy = a.y - b.y;
						const d = Math.hypot(dx, dy);
						if (d <= settings.linkDistance) {
							const alpha =
								settings.linkOpacity *
								(1 - d / settings.linkDistance);
							ctx.globalAlpha = alpha;
							ctx.strokeStyle = "rgba(255,255,255,0.9)";
							ctx.lineWidth = 1;
							ctx.beginPath();
							ctx.moveTo(a.x, a.y);
							ctx.lineTo(b.x, b.y);
							ctx.stroke();
						}
					}
				}

				// dots
				for (const p of particles) {
					ctx.globalAlpha = settings.dotOpacity;
					ctx.fillStyle = colorBetween(p.t);
					ctx.beginPath();
					ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
					ctx.fill();
				}

				ctx.globalAlpha = 1;
				requestAnimationFrame(step);
			}

			requestAnimationFrame(step);
		</script>
	</body>
</html>
